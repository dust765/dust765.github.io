<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Dust765</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&family=Crimson+Text:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red-700: #8c1515;
      --red-600: #a81818;
      --red-500: #c41f1f;
      --red-400: #d43030;
      --red-300: #e04040;
      --red-200: #e87070;
      --text: #1a1212;
      --text-dim: #4d4242;
      --bg: #ffffff;
      --bg2: #fff9f9;
      --border: rgba(180, 40, 40, 0.22);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Crimson Text', Georgia, serif;
      font-weight: 500;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: .2;
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
    }
    img {
      height: 48px;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 20px rgba(180,30,30,.4));
    }
    .code {
      font-family: 'Caudex', Georgia, serif;
      font-weight: 700;
      font-size: clamp(4rem, 15vw, 6.5rem);
      color: var(--red-300);
      line-height: 1;
      text-shadow: 0 0 40px rgba(180,30,30,.35);
      margin-bottom: .75rem;
    }
    h1 {
      font-family: 'Caudex', Georgia, serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }
    p {
      color: var(--text-dim);
      font-size: 1.1rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      justify-content: center;
    }
    a {
      font-family: 'Caudex', Georgia, serif;
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .6rem 1.35rem;
      border-radius: 2px;
      text-decoration: none;
      transition: background .2s, border-color .2s, color .2s;
    }
    .btn-primary {
      background: var(--red-600);
      color: #ffffff;
      border: 1px solid var(--red-400);
    }
    .btn-primary:hover { background: var(--red-500); }
    .btn-outline {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      border-color: var(--red-500);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/"><img src="/logodust.png" alt="Dust765" /></a>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>This path does not exist or was moved. Return home or open the documentation wiki.</p>
    <div class="actions">
      <a class="btn-primary" href="/">Back to home</a>
      <a class="btn-outline" href="/wiki.html">Wiki</a>
    </div>
  </div>
</body>
</html>
